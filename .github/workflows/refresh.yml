name: Refresh feed

# Daily: look for new episodes, publish the feed, deploy, then transcribe the
# new episode on the runner's CPU and publish again.
#
# Separate concerns, separate jobs:
#   publish             must never be blocked by a transcription problem
#   transcribe          runs third-party Python code for hours, so it gets a
#                       read-only token and no secrets but HF_TOKEN
#   commit-transcripts  takes only the transcript JSON from that job and commits
#   deploy-*            the only jobs that can read the Dokku key
#   report              turns "an episode couldn't be scraped" into a failed run
#
# Transcription only runs when the repository variable TRANSCRIBE_IN_CI is
# "true" (or when asked for in a manual run).
on:
  schedule:
    - cron: '17 4 * * *' # UTC
  workflow_dispatch:
    inputs:
      transcribe:
        description: Transcribe the newest pending episode
        type: choice
        options: [auto, 'on', 'off']
        default: auto
      dry_run:
        description: Commit, push and deploy nothing
        type: boolean
        default: false
      guid:
        description: 'Timing test: transcribe this guid into .cache/ci-test and commit nothing'
        type: string
      model:
        description: Whisper model override, e.g. large-v3-turbo
        type: string
      batch_size:
        description: faster-whisper batch size
        type: string
        default: '8'

concurrency:
  group: refresh
  cancel-in-progress: false

permissions: {}

# bash explicitly, so steps run with -eo pipefail and a failure on the left of
# a pipe is not swallowed.
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      partial: ${{ steps.regenerate.outputs.partial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
          cache: true

      # Fails the job before anything is committed when the source site is
      # unreachable or answers with a challenge page. Exit code 3 means the
      # feed was written but a listed episode couldn't be scraped: publish what
      # we have and let the report job flag the run.
      - name: Regenerate the feed
        id: regenerate
        run: |
          status=0
          deno task regenerate --no-transcripts || status=$?
          if [ "$status" -eq 3 ]; then
            echo 'partial=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Commit and push the feed
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true && inputs.guid == ''
        run: |
          old=$(git show HEAD:feed.rss | grep -c '<item>' || true)
          new=$(grep -c '<item>' feed.rss || true)
          message='Update feed'
          if [ "$new" -gt "$old" ]; then message='Release new episodes'; fi
          bash .github/scripts/commit-and-push.sh "$message" feed.rss

      # GitHub disables schedules in public repos after 60 days without
      # activity, and episodes have been up to 56 days apart. Best effort.
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"

  # Runs on every scheduled run, even without changes, so a deploy that failed
  # after its commit had landed heals itself the next day.
  deploy-feed:
    needs: publish
    if: github.ref == 'refs/heads/main' && inputs.dry_run != true
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      skip_tests: true
    secrets: inherit

  report:
    needs: publish
    if: needs.publish.outputs.partial == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::A listed episode could not be scraped; see the "Listed but not scraped" lines in the publish job.'
          exit 1

  transcribe:
    needs: publish
    if: inputs.transcribe == 'on' || (inputs.transcribe != 'off' && vars.TRANSCRIBE_IN_CI == 'true')
    runs-on: ubuntu-24.04
    # GitHub's hard limit per job is 360.
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      transcribed: ${{ steps.transcribe.outcome == 'success' && inputs.guid == '' }}
    env:
      TRANSCRIBE_ENGINE: faster-whisper
      TRANSCRIBE_BATCH_SIZE: ${{ inputs.batch_size || vars.TRANSCRIBE_BATCH_SIZE || '8' }}
      # Empty means the engine's default model.
      TRANSCRIBE_MODEL: ${{ inputs.model || vars.TRANSCRIBE_MODEL }}
      # Optional, avoids anonymous rate limits on the model download.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GUID: ${{ inputs.guid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, which includes what the publish job just pushed;
          # the default would be the commit that triggered the run.
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
          cache: true

      # Only episodes from the last 60 days: CI never backfills, and an old
      # episode that can't be transcribed can't cause a failure every day.
      - name: Find the episode to transcribe
        id: pending
        run: |
          if [ -n "$GUID" ]; then
            echo 'count=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deno task transcribe --dry-run --newest-first --limit 1 --max-age-days 60 | tee "$RUNNER_TEMP/pending.tsv"
          echo "count=$(grep -cE '^[0-9]+' "$RUNNER_TEMP/pending.tsv" || true)" >> "$GITHUB_OUTPUT"
          echo "guid=$(grep -E '^[0-9]+' "$RUNNER_TEMP/pending.tsv" | head -n 1 | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: steps.pending.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.pending.outputs.count != '0'
        with:
          # Used about once a month; a cache would be evicted long before.
          enable-cache: false

      # Fails fast on a broken Python environment, before hours of work.
      - name: Install the transcription sidecar
        if: steps.pending.outputs.count != '0'
        run: uv sync --project transcription/sidecar --locked

      - name: Transcribe
        id: transcribe
        if: steps.pending.outputs.count != '0'
        timeout-minutes: 320
        env:
          PENDING_GUID: ${{ steps.pending.outputs.guid }}
        run: |
          if [ -n "$GUID" ]; then
            deno task transcribe --force --guid "$GUID" --out-dir .cache/ci-test
          else
            # Written next to, not into, transcripts/: the commit job decides
            # what gets in. The guid is explicit because "pending" was decided
            # against transcripts/, not against this empty directory.
            deno task transcribe --guid "$PENDING_GUID" --out-dir .cache/new-transcripts
          fi

      # Handed to the commit job, and kept so hours of work survive a failed push.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.pending.outputs.count != '0'
        with:
          name: transcription
          path: |
            .cache/new-transcripts
            .cache/ci-test
            .cache/transcribe.log
          include-hidden-files: true
          if-no-files-found: ignore

  commit-transcripts:
    needs: transcribe
    if: needs.transcribe.outputs.transcribed == 'true' && github.ref == 'refs/heads/main' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transcription
          path: ${{ runner.temp }}/artifact

      # The artifact comes from a job that ran third-party code, so take only
      # what a transcript looks like: <digits>.json that parses as JSON.
      - name: Take the transcripts from the artifact
        run: |
          found=0
          while IFS= read -r file; do
            jq -e '.version == 1 and (.segments | type == "array")' "$file" > /dev/null
            cp "$file" "transcripts/$(basename "$file")"
            found=$((found + 1))
          done < <(find "$RUNNER_TEMP/artifact" -type f -regextype posix-extended -regex '.*/new-transcripts/[0-9]+\.json')
          echo "Took $found transcript(s)."
          [ "$found" -gt 0 ]

      - name: Commit transcripts and the tagged feed
        id: commit
        run: |
          # Adds the <podcast:transcript> tags. If the source site is down right
          # now, tomorrow's publish job adds them instead.
          deno task regenerate --no-transcripts || echo '::warning::Feed refresh failed; the next run adds the transcript tags.'
          bash .github/scripts/commit-and-push.sh 'Add episode transcripts' transcripts feed.rss

  deploy-transcripts:
    needs: commit-transcripts
    if: needs.commit-transcripts.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      skip_tests: true
    secrets: inherit
